# 数据集处理配置 (AudioPreProcess Configuration)

# ============================================================
# 【完整流水线执行时序与配置映射】
#
#   1. 输入扫描 & 文本处理 [第 1、2 节: root_dir, text, asr]
#      - 扫描配对、hash 去重、文本清洗与繁简转换
#      - 若有 {ASR} 占位符则按需启动 ASR 识别填充，随后立即释放模型
#      └── 质检插桩阶段: after_scan (执行格式审计 audit)
#
#   2. 音频归一化 [第 3 节: audio]
#      - 逐条处理写入 temp_dir (原文件不动): 格式转换+去直流 → LUFS响度 → 静音修剪
#      └── 质检插桩阶段: after_normalize (削波 clipping / 静默比例 silence_ratio / 信噪比 snr)
#
#   3. 时长分流 [第 5 节: split_and_merge.short/long_threshold]
#      - 划分为: 短音频 (≤ short) / 常规音频 / 长音频 (≥ long)
#      └── 质检插桩阶段: after_classify (可选)
#
#   4. 首次情感识别 SER(1) [第 4 节: ser]
#      - 对短音频与常规音频进行批量情感预测，完成后立即释放 SER 模型
#
#   5. 短音频合并 [第 5 节: split_and_merge.merge_silence_duration]
#      - 同情感短音频拼接；跨情感剩余碎片使用多数投票法归类
#      └── 质检插桩阶段: after_merge (可选)
#
#   6. 长音频切分 [第 6 节: split]
#      - WhisperX 字符级强制对齐 → 动态规划 (DP) 寻找静音切分点 → ffmpeg 无损裁剪与标点回移
#
#   7. 二次情感识别 SER(2) [第 4 节: ser]
#      - 对切分后的子片段独立进行情感预测；处理切分失败音频 (on_split_failure)
#      └── 质检插桩阶段: final (全量条目终审质检)
#
#   8. 输出整理与标注生成 [第 7 节: use_lab_text_as_filename, output]
#      - 按情感分目录归档音频，生成对应 .list 与 .jsonl 标注文件及汇总报告
#
#   9. 临时缓存清理 (自动执行)
#      - 自动移除 temp_dir 临时目录
# ============================================================


# ============================================================
# 0. 质检流水线 (Quality Checks Pipeline)
# 全局质检插桩系统，支持在流水线的各个关键节点进行音频质量审查与拦截。
#
# run_at 可选阶段:
#   - after_scan:       输入扫描与文本处理后 (首选: 格式审计 audit)
#   - after_normalize:  音频三步归一化后 (首选: 削波检测 clipping, 静默比例 silence_ratio, SNR)
#   - after_classify:   时长分类后 (可选)
#   - after_merge:      短音频合并后 (可选)
#   - final:            全流程结束、输出整理前 (首选: 全量指标终审)
#
# reject_action (违规样本处理策略):
#   - warn_only: 仅在报告中记录，音频继续保留在流水线中
#   - isolate:   将不合格音频复制到 隔离/<检查名>_<阶段>/ 目录，并从流水线中剔除
#   - remove:    直接从流水线中剔除 (不保留隔离文件)
#
# ⚠️ 注意:
#   1. 同一检查配置多个 run_at 时 (如 ["after_normalize", "final"])，仅最后一次执行会真正应用拒绝动作
#   2. audit (格式审计) 仅输出元数据报告，不支持 reject_action (不隔离/剔除文件)
# ============================================================
checks:
  audit:
    enable: true
    run_at: ["after_scan", "final"] 
    target_sample_rate: 44100   # 审计目标采样率 (建议与第 3 节 audio.target_sample_rate 保持一致)
    target_channels: 1          # 审计目标声道数
    target_bit_depth: 16        # 审计目标位深

  clipping:
    enable: true
    run_at: ["after_normalize", "final"]  
    reject_action: "isolate"
    clip_threshold: 0.99          # 振幅 ≥ 0.99 (即 ≈ -0.09 dBFS) 视为削波
    warn_threshold: 0.01          # 削波样本比例 > 1% 警告
    reject_threshold: 0.05       # 削波样本比例 > 5% 拒绝

  silence_ratio:
    enable: true
    run_at: ["after_normalize", "final"]  
    reject_action: "isolate"     # 拒绝样本复制到隔离目录并移出流程
    top_db: 30                    # 静音判定门限 (同 trim_silence.top_db)
    warn_threshold: 0.4           # 静默比例 > 40% 警告
    reject_threshold: 0.7         # 静默比例 > 70% 拒绝

  snr:
    enable: true
    run_at: ["after_normalize", "final"]
    reject_action: "isolate"
    top_db: 30                    # VAD-SNR 的语音/噪声分离门限
    warn_db: 20                   # SNR < 20dB 警告
    reject_db: 15                 # SNR < 15dB 拒绝


# ============================================================
# 1. 输入扫描 (Input Scan)
# 扫描输入目录中的音频与 .lab 配对文件，按 .lab 内容 hash 自动去重。
# 当存在同名不同格式的音频时，按 audio.input_formats 优先级选择 (.wav 优先)。
# ============================================================
# 输入目录：包含音频和 .lab 文件的原始数据集文件夹
root_dir: './input/芙宁娜-emo'
# 是否递归处理输入目录下的所有子文件夹
# true:  处理所有子文件夹中的文件
# false: 仅处理根目录下的文件
recursive: true


# ============================================================
# 2. 文本处理与 ASR (Text Processing & ASR)
# 在输入扫描阶段对 .lab 标注文本执行清洗：繁简转换、字符替换、占位符处理。
# 若规则替换后文本中存在 {ASR} 占位符，将按需触发 ASR 模型识别并自动填充。
# ============================================================
text:
  # 繁体转简体 (使用 OpenCC)
  t2s: true
  # 文本替换规则: 键=要替换的文本, 值=替换后的文本
  # 支持特殊占位符:
  #   {SKIP}  — 跳过包含此占位符的音频 (整条丢弃)
  #   {ASR}   — 用语音识别结果替换占位符 (按需调用下方 asr 配置)
  replace_map:
    "|": ""
    "\n": " "
    "\r": ""
    "「": ""
    "」": ""
    " / ": "，"
    "（": ""
    "）": ""
    "(": ""
    ")": ""
    "#": ""
    "{M#他}{F#她}": "他"
    "{M#他们}{F#她们}": "他们"
    "{M他}{F她}": "他"
    "{M他们}{F她们}": "他们"
    "{PLAYERAVATARSEXPRO[INFO_MALE_PRONOUN_HEINFO_FEMALE_PRONOUN_SHE]}": "他"
    
    # --- 特殊规则示例 ---
    # {ASR}: 将占位符替换为语音识别结果
    # 例如: lab 包含 "你好，{PLAYER_NAME}"，程序会识别该音频并用识别文本替换 {PLAYER_NAME}
    
    # {SKIP}: 跳过包含此占位符的音频
    # 例如: lab 包含 "BGM-{NICKNAME}"，该音频文件将被完全跳过
    "{NICKNAME}": "{SKIP}"

# ── 2a. ASR 自动语音识别配置 ──
# 仅在扫描阶段遇到 {ASR} 占位符时按需加载，识别完毕后立即释放显存。
# FunASR 后端支持三种模型 (根据 model 名自动检测):
#   paraformer-zh:     纯中文 ASR, 需 punc_model (ct-punc) 加标点, force_align 时调用 WhisperX 补全时间戳
#   SenseVoiceSmall:   多语言 ASR+情感+事件, 自带标点, 支持原生字符级 force_align 时间戳
#   Fun-ASR-Nano-2512: LLM 架构, 自带标点, force_align 时调用 WhisperX 补全时间戳, 内部自动使用 batch_size=1
asr:
  language: "zh"  # ASR 语言代码 (通用 ISO 代码, 内部自动映射为各模型格式):
                   #   "zh"|"en"|"ja"|"yue"|"ko"|"auto"|"nospeech"
                   #   paraformer-zh:     忽略此字段 (仅支持中文)
                   #   SenseVoiceSmall:   直接使用上述代码 ("auto"=自动检测, "nospeech"=静音检测)
                   #   Fun-ASR-Nano-2512: 自动映射为中文全称 ("zh"→"中文", "en"→"英文", "ja"→"日文",
                   #                       "yue"→"粤语", "ko"→"韩文", "auto"/"nospeech"=不传)
  backend: "funasr"  # ASR 后端: "funasr" (FunASR) | "whisperx" (WhisperX Whisper)
  # 强制对齐开关: true=返回字符级时间戳 segment; false=返回纯文本单个 segment
  # 为精确的占位符上下文匹配与定位准备时间戳数据
  force_align: True
  # FunASR 参数 (backend="funasr" 时生效)
  funasr:
    model: "FunAudioLLM/SenseVoiceSmall"
                                     # FunASR 模型:
                                     #   paraformer-zh (中文 ASR)
                                     #   FunAudioLLM/SenseVoiceSmall (ASR+情感+事件) 
                                     #   FunAudioLLM/Fun-ASR-Nano-2512 (LLM 架构 ASR)
    use_vad: true            # 是否使用语音活动检测 (VAD) 分段长音频, 推荐对长音频开启
    vad_max_single_segment_time: 30000  # VAD 单段最大时长 ms (use_vad=true 时生效)
    itn: true                # 逆文本归一化 + 标点:
                             #   SenseVoiceSmall: 映射为 use_itn, 同时控制标点和数字归一化 (绑定, 不可分离)
                             #   Fun-ASR-Nano-2512: 映射为 itn, 标点由模型内置始终输出
                             #   paraformer-zh: 忽略, 标点由独立 punc_model (ct-punc) 负责
  # WhisperX 参数 (backend="whisperx" 时生效)
  whisperx:
    model: "large-v2"  # Whisper 模型: tiny/base/small/medium/large-v2/large-v3
                        # large-v2 中文效果最佳; medium 为速度/精度折衷
    batch_size: 16     # 推理批大小, GPU 显存不足时减小 (8/4)
  # WhisperX 强制对齐参数 (force_align=true 且 backend="whisperx" 或 FunASR 非原生对齐模型时生效)
  whisperx_align:
    device: "auto"     # 对齐模型设备: "cuda", "cpu", "auto" (自动检测)
    language: "zh"     # 对齐模型语言代码 (默认继承 asr.language)


# ============================================================
# 3. 音频归一化 (Audio Normalization)
# 对扫描后的所有音频执行标准化处理 (逐条处理写入 temp_dir，原文件不动):
#   3a. 格式转换与采样率统一 + 直流偏移消除 (DC Offset Removal)
#   3b. LUFS 响度归一化 (Loudness Normalization)
#   3c. 首尾静音修剪 (Silence Trimming)
# 缺少 audio: 段时，管道行为与旧版一致 (不执行预处理)
# ============================================================
audio:
  # ── 3a. 格式归一化 ──
  # 将任意输入格式统一转为 WAV 16-bit PCM，重采样到目标采样率
  # 通过 ffmpeg 实现: -ar <采样率> -ac <声道> -sample_fmt s16
  target_sample_rate: 44100    # 目标采样率 (Hz)
                               # ┌─────────────────┬───────────┐
                               # │ 框架            │ 采样率     │
                               # ├─────────────────┼───────────┤
                               # │ GPT-SoVITS      │ 32000     │
                               # │ So-VITS-SVC 4.0 │ 44100     │
                               # │ DDSP            │ 44100     │
                               # │ RVC v2          │ 40000     │
                               # │ Bert-VITS2      │ 44100     │
                               # │ CosyVoice       │ 24000     │
                               # │ Diff-SVC        │ 24000     │
                               # │ Fish Speech     │ 32000     │
                               # │ VITS (LJSpeech) │ 22050     │
                               # └─────────────────┴───────────┘
                               # TTS=44100 (通用兼容) / 32000 (GPT-SoVITS) / 24000 (CosyVoice)
                               # SVC=44100 (So-VITS-SVC 标准，保留完整谐波频谱至 22kHz)
                               # 注意: 修改此项需与目标模型的采样率一致，否则需推理时重采样
  target_channels: 1           # 目标声道数
                               # 1 = 单声道 (TTS/SVC 训练数据标准; 所有主流框架均要求单声道)
                               # 2 = 立体声 (极少数场景，如音乐生成)
  target_bit_depth: 16         # 目标位深 (bit)
                               # 16 = PCM 16-bit (所有主流 TTS/SVC 框架的标准: int16, max_wav_value=32768)
                               # 24/32 = 更高位深 (非训练必须，仅用于高质量存档)
  input_formats: ["wav", "flac", "mp3", "ogg", "aac", "m4a"]  # 支持的输入格式
                                                               # 同一 .lab 对应多种格式时，按列表顺序优先选择 (.wav 优先)

  # ── 3a 附带: 直流偏移消除 (DC Offset Removal) ──
  # 在格式归一化步骤中附带执行，使用 ffmpeg highpass=f=5 滤波器
  # 去除 5Hz 以下的直流分量 (人声不可闻但对浮点计算有害)
  dc_offset_removal:
    enabled: true               # 默认开启，在格式归一化时一并执行
                               # RVC 使用 48Hz 巴特沃斯高通滤波器 (5 阶) 做类似处理
                               # 5Hz 高通更温和 (仅去直流)，48Hz 更激进 (也去低频隆隆声)
    threshold: 0.001           # DC 偏移量 (均值) 大于此值才执行消除
                               # 0.001 = 0.1% 全量程; 几乎所有录音都有微量 DC 偏移
                               # 低于此值表示无显著 DC 偏移，跳过以节省处理时间

  # ── 3b. LUFS 响度归一化 ──
  # 基于 EBU R128 标准 (ITU-R BS.1770)，使用 ffmpeg loudnorm 滤波器
  # 确保数据集内所有音频的感知响度一致
  loudness:
    enabled: true
    target_lufs: -16           # 目标响度 (LUFS, 加权分贝)
                               # ┌──────────────────────────────┬───────────┐
                               # │ 用途/标准                    │ LUFS      │
                               # ├──────────────────────────────┼───────────┤
                               # │ EBU R128 广播标准             │ -23       │
                               # │ ATSC A/85 美国电视标准        │ -24 LKFS  │
                               # │ Google Assistant 单声道 TTS   │ -19       │
                               # │ Google Assistant 立体声 TTS   │ -16       │
                               # │ AES TD1008 语音内容           │ -18       │
                               # │ Apple Music Sound Check       │ -16       │
                               # │ Spotify/YouTube 流媒体         │ -14       │
                               # │ Netflix (对话门控)            │ -27 LKFS  │
                               # └──────────────────────────────┴───────────┘
                               # TTS=-19 (单声道, Google 标准最权威) / -16 (兼容流媒体)
                               # SVC=-18 (AES 语音标准, 为歌唱动态留出余量)
                               # 注意: 本项目默认输出单声道 (target_channels=1)
                               #   单声道权威参考是 -19 LUFS (Google Assistant)
                               #   -16 是立体声标准，单声道下偏响但可接受
                               # ⚠️ So-VITS-SVC 默认响应度匹配到 0dBFS，官方明确警告会导致
                               #   "sonic boom" 并推荐使用 Adobe Audition 替代，使用本软件
                               #   响度归一后应关闭So-VITS-SVC自带的响度匹配
    true_peak: -1.5            # True Peak 限制 (dBTP, 真实峰值)
                               # ┌──────────────────────┬──────────┐
                               # │ 标准                 │ dBTP     │
                               # ├──────────────────────┼──────────┤
                               # │ EBU R128 广播标准     │ -1.0     │
                               # │ ITU-R BS.1770-4      │ -1.0     │
                               # │ Spotify/Apple Music   │ -1.0     │
                               # │ Amazon Music          │ -2.0     │
                               # │ Netflix              │ -2.0     │
                               # │ ffmpeg loudnorm 默认  │ -2.0     │
                               # └──────────────────────┴──────────┘
                               # -1.0 = EBU R128 严格标准 (防止帧间采样峰值超 0dBFS)
                               # -1.5 = 保守折衷 (当前值，在 -1.0 和 ffmpeg 默认 -2.0 之间)
                               # -2.0 = 最保守 (适合后续经过有损编码的场景)
                               # 原理: 帧间峰值 (inter-sample peak) 可能超过采样值;
                               #   有损编码 (AAC/OGG) 会进一步提升峰值
    lra: 7                     # 响度范围限制 (LU, Loudness Range)
                               # 定义: EBU Tech 3342 — 10th 到 95th 百分位的响度差值
                               # ┌──────────────────────┬──────────┐
                               # │ 类型                 │ LRA (LU) │
                               # ├──────────────────────┼──────────┤
                               # │ 有声书/播客           │ 3-6      │
                               # │ 语音/广播             │ 5-8      │
                               # │ 流行音乐              │ 5-10     │
                               # │ 歌唱 (SVC)           │ 7-12     │
                               # │ 古典音乐/动态大片      │ 10-20    │
                               # └──────────────────────┴──────────┘
                               # TTS=5-7 / SVC=8-12
                               # 注意: EBU R128 不强制 LRA 上限 (描述性指标，非规范性)
                               #       当 dual_pass=true (linear=true) 时，LRA 参数不生效
                               #       仅在动态模式 (单 pass) 下 LRA 被用于压缩/扩展
    dual_pass: True            # 双 pass 模式开关
                               # false = 单 pass: 快速，ffmpeg 动态估算响度并应用
                               #         缺点: 使用动态压缩 (dynamic compression) 达标，可能改变语音动态
                               #         精度: ±0.5-1 LU
                               # true  = 双 pass: 第 1 pass 仅测量 (输出 JSON)，
                               #         第 2 pass 用精确测量值 + linear=true 做线性增益
                               #         优点: 不改变音频动态特征，仅做纯增益调整
                               #         精度: ±0.1 LU; 速度: 约 2× 编码时间
                               # TTS/SVC 推荐: true (保留自然动态，避免压缩伪影)
                               # 参考: https://ffmpeg-cookbook.com/en/articles/loudness-normalization/

  # ── 3c. 首尾静音修剪 ──
  # 使用 librosa.effects.trim 检测首尾静音段并裁剪
  # 修剪后通过 soundfile 写出 (保证采样率无损)
  trim_silence:
    enabled: true
    top_db: 30                 # 低于峰值此 dB 值的帧视为"静音" (librosa 默认 60dB)
                               # ── 判断方法: 相对峰值门限法 (Relative Peak Thresholding) ──
                               # 1. 按 frame_length/hop_length 分帧，计算每帧 RMS 振幅 (dB)
                               # 2. 取整段音频的最大帧振幅作为参考 ref (0 dB)
                               # 3. 每帧振幅 < (ref - top_db) → 判为静音
                               #    例: top_db=30, 峰值=0dB → 低于 -30dB 的帧为静音
                               # ── 为什么用相对门限而非绝对门限如 -40 dBFS ──
                               # 绝对门限: 小声录音 (语音 -35dBFS) 会被误判为静音
                               # 相对门限: 自动适配每段音频响度, 无论大声/小声都能正确区分
                               # 由于不同录音响度差异大时标准不统一, 本管道采用
                               #     先归一化后修剪的顺序, 响度统一后再修剪首尾静音,
                               #     这同时避免修剪后音频过短导致 EBU R128 测量失败
                               # ── 方向 ──
                               # 值越小 → 越容易判定为静音 → 裁剪更积极 (保留更少弱音)
                               # 值越大 → 越难判定为静音 → 裁剪更保守 (保留更多弱音)
                               # TTS=25-30 / SVC=25-28
                               # So-VITS-SVC-fork 默认: top_db=30
                               # GPT-SoVITS (openvpi/audio-slicer): threshold=-40dB, 约等效 top_db=40
                               # RVC: threshold=-42dB
                               # ⚠️ SVC 歌唱需高低值: 过度修剪会切掉尾音衰减、气声和弱音延音
    frame_length: 2048         # 分析帧长 (采样点数)
                               # 2048 = 标准值 (约 46ms @44.1kHz, 约 64ms @32kHz)
                               # librosa.effects.trim 默认值，无需调整
    hop_length: 512             # 帧移步长 (采样点数)
                               # 512 = 标准值 (约 11.6ms @44.1kHz)
                               # 与 STFT 分析和多数 TTS 模型的 hop_size 一致
    min_trim_ms: 100           # 首尾静音至少多少毫秒才值得修剪
                               # TTS=100 / SVC=300-500
                               # 低于此值的静音不处理，避免微小静音导致的过度裁剪
                               # SVC 需更大值以保护尾音的自然衰减和混响尾声
    keep_padding_ms: 50        # 修剪后前后各保留的缓冲时长 (毫秒)
                               # TTS=50 / SVC=300-500
                               # 防止切得太干净导致起止处的爆音 (click/pop)
                               # SVC 歌唱需要更多缓冲以保留混响尾声 (~300-800ms)
                               # openvpi/audio-slicer 默认 max_sil_kept=500ms
                               # RVC 默认 max_sil_kept=5000ms (5s，较宽裕)


# ============================================================
# 4. 情感分类 (Speech Emotion Recognition, SER)
# 识别音频的情感标签，用于多情感 TTS/SVC 模型训练与数据集分流。
#
# 在流水线中执行两次:
#   - SER(1): 在归一化与时长分类后，对短音频和常规音频进行情感预测 (为同情感合并提供标签)
#   - SER(2): 在长音频切分后，对切分产生的每个子片段独立进行情感预测
#
# 支持三种后端 (backend):
#   hubert:       HuBERT 模型, 6s 硬截断, 输出 6 类情感
#   emotion2vec:  emotion2vec+ large, 推荐 ≤30s, 输出 9 类情感
#   sensevoice:   SenseVoiceSmall, 内置 VAD 分块, 输出 7 类情感
# ============================================================
ser:
  enabled: true
  backend: "hubert"    # "hubert" | "emotion2vec" | "sensevoice"
  device: "auto"       # "cuda", "cpu", "auto"

  # SER 失败处理策略
  # "default":             返回 "unknown" 标签, 音频继续后续流程
  # "truncate_and_retry":  截断音频到 safe_max_duration 后重试 (防 OOM), 仅对 emotion2vec 有效
  # "isolate":             将音频移入 隔离/SER失败/ 目录, 移出流水线
  on_failure: "default"

  # --- HuBERT 后端 ---
  hubert:
    model_id: "xmj2002/hubert-base-ch-speech-emotion-recognition"

  # --- emotion2vec 后端 ---
  emotion2vec:
    model_id: "emotion2vec/emotion2vec_plus_large"
    granularity: "utterance"  # "utterance" | "frame"
    safe_max_duration: 30     # truncate_and_retry 时的安全截断时长 (秒)

  # --- SenseVoice 后端 ---
  sensevoice:
    model_id: "FunAudioLLM/SenseVoiceSmall"
    language: "auto"           # "zh"|"en"|"yue"|"ja"|"ko"|"auto"
    use_itn: true
    ban_emo_unk: false
    vad_max_single_segment_time: 30000  # ms


# ============================================================
# 5. 时长分流与短音频合并 (Duration Split & Merge)
#   5a. 时长分流: 将归一化后的音频划分为 短音频 (≤ short)、常规音频、长音频 (≥ long)
#   5b. 短音频合并: 在 SER(1) 识别情感后，按同情感分组进行 2-3 个一组合并 (ffmpeg concat + 静音间隔)
#                   跨情感剩余碎片使用多数投票法 (Majority Vote) 归类
# ============================================================
split_and_merge:
  short_threshold: 3.0  # 小于等于此值为短音频 (会被分组合并)
                         # TTS=3.0 / SVC=3.0-5.0
                         # 短于 3s 的片段缺少足够的音素多样性，模型难以学习韵律
  long_threshold: 25.0  # 大于等于此值为长音频 (触发自动切分门限)
                         # 区分说明: 此项控制“哪些音频需要切分”，而第 6 节 split.max_duration 控制“切分出的片段最大时长”
                         # TTS=25.0 / SVC=15.0-20.0
                         # GPT-SoVITS: 25s 上限; So-VITS-SVC: 15s 更安全 (避免 GPU OOM)
                         # 注意: Whisper/WhisperX 对齐上限 30s
  merge_silence_duration: 0.3 # 合并短音频时，片段之间插入的静音时长 (秒)
                                # TTS=0.3 / SVC=0.3-0.5
                                # GPT-SoVITS 默认片段间隔 0.3s
                                # SVC 歌唱需要稍多间隔以保留乐句节奏感
  output_to_split_folder: false # true: 切分文件输出到 "切分后" 子文件夹; false: 和其他文件一起输出
  # 切分失败处理策略 (长音频切分失败时的回退机制)
  # "ignore":  保留在流程中, 继续对其跑 SER 情感识别并输出
  # "isolate": 将切分失败的长音频移入 隔离/切分失败/ 目录, 移出流水线
  on_split_failure: "ignore"


# ============================================================
# 6. 长音频切分 (Long Audio Split)
# 长音频处理流程:
#   1. WhisperX 强制对齐生成字符级时间戳
#   2. 动态规划 (DP) 寻找最优静音切分点
#   3. ffmpeg 精确裁剪音频并同步切分 .lab 文本
#   4. 标点符号回移校正 (adjust_punctuation)
#   5. 对每个切分出的子片段独立执行 SER(2) 情感分类
# ============================================================
split:
  # --- whisperx 对齐模型与设备 ---
  device: "auto"              # "cuda", "cpu", "auto" (自动检测 GPU)
  language: "zh"              # whisperx 使用的语言代码
                               # "zh" 中文, "en" 英文, "ja" 日文 等

  # --- 切分策略 ---
  # 推荐时长范围 (秒):
  #   TTS: GPT-SoVITS 推荐 3-25s; VITS/LJSpeech 数据集 1-10s; F5-TTS 上限 15s
  #   SVC: So-VITS-SVC 推荐 5-15s; RVC 按 3.7s 切分; Diff-SVC 切片 ~5-10s
  min_duration: 3.0             # 切分后单段最小时长 (秒)
                                  # TTS=3.0 / SVC=5.0
                                  # So-VITS-SVC 推荐 5s 起; GPT-SoVITS (openvpi/audio-slicer) 默认 min_length=5s
                                  # 低于 3s 的片段音素覆盖不足，模型学习效果差
  max_duration: 25.0            # 切分后单段最大时长 (秒)
                                  # TTS=25.0 / SVC=15.0
                                  # GPT-SoVITS: 25s 可用; So-VITS-SVC 官方建议 <15s
                                  # 超过 15s 在 SVC 训练中可能导致 GPU 显存溢出
  max_segments: 5               # 单个长音频最多切成几段 (限制切分段数避免碎片化)

  # --- 静音检测与切分点 ---
  split_silence_top_db: 40      # 静音判定门限 (同 trim_silence.top_db)
                                   # 值越大 → 越难判定为静音 → 切分更保守 (更少切分点)
                                   # 值越小 → 越易判定为静音 → 切分更积极 (更多切分点)
                                   # 此参数用于 whisperX 对齐后检测静音区间以确定切分点
                                   # TTS=35-40 / SVC=30-35
                                   # GPT-SoVITS (openvpi/audio-slicer): threshold=-40dB RMS, 约等效 top_db=40
                                   # RVC: threshold=-42dB RMS
                                   # SVC 歌唱需较大值以保留弱音/气声
  split_min_silence_len_ms: 500 # 最小静音时长 (毫秒), 用于过滤字间/词间短停顿
                                   # TTS=300-500 / SVC=300-500
                                   # 低于此值的静音不作为切分点，避免在词间停顿处误切
  split_offset_from_silence_end_ms: 0 # 在静音区段末尾的偏移量 (毫秒), 负数表示提前切
                                        # 0: 在静音结束时切分; -100: 提前 100ms 切入语音起始
                                        # 微调切分点位置以避免切掉后一句的开头


# ============================================================
# 7. 输出整理与标注生成 (Output Finalization)
# 全流程完成后的文件整理与标注元数据生成:
#   - 音频文件按情感子目录归类 (启用 SER 时)
#   - 生成训练列表文件 (.list) 与富元数据文件 (.jsonl)
#   - 生成时长摘要 (！<时长>_<emotion>.txt) 与合并/切分日志 (！合并记录.txt / ！切分记录.txt)
# ============================================================
# 是否使用 .lab 文件的内容作为最终输出的音频文件名
# true:  使用标注文本命名 (例如 "你好世界.wav")
# false: 保留原始文件名或生成新格式 (例如 "角色名_merge_1.wav")
use_lab_text_as_filename: false

output:
  jsonl_output: true # true: 为每个 .list 文件生成对应 .jsonl 格式标注文件
                     # .list:  路径|角色名|语言|文本 格式 (GPT-SoVITS 标准格式)
                     # .jsonl: JSON 行格式 (含 id, audio, text, speaker 等字段)
