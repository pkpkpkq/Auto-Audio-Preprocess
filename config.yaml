# 数据集处理配置

# --- 核心路径配置 ---
# 输入目录：包含 .wav 和 .lab 文件的原始数据集文件夹
root_dir: ''
# 是否递归处理输入目录下的所有子文件夹
# true: 处理所有子文件夹
# false: 仅处理根目录下的文件
recursive: true

# --- 文件处理配置 ---
# 是否使用 .lab 文件的内容作为最终输出的音频文件名
# true: 使用标注文本命名 (例如 "你好世界.wav")
# false: 保留原始文件名或生成新格式 (例如 "角色名_merge_1.wav")
use_lab_text_as_filename: false

# --- 音频处理配置 ---
# 切分与合并的配置
# gpt-sovits 3-25s 
# so-vits-svc 2-15s
split_and_merge:
  short_threshold: 3.0  # 小于等于此值为短音频 (会被合并)
  long_threshold: 25.0  # 大于等于此值为长音频 (会被切分)
  merge_silence_duration: 0.3 # 合并短音频时，在片段之间插入的静音时长 (秒)
  output_to_split_folder: false # true: 将切分文件输出到 "切分后" 子文件夹; false: 和其他文件一起输出

# --- 长音频切分配置 ---
split:
  # --- 模型与设备 ---
  device: "auto"              # "cuda", "cpu", "auto"
  language: "zh"              # whisperx 使用的语言代码

  # --- 切分策略 ---
  min_duration: 3.0             # 切分后单段最小时长
  max_duration: 25.0            # 切分后单段最大时长
  max_segments: 5               # 单个长音频最多切成几段

  # --- 静音检测与切分点 ---
  split_silence_top_db: 40      # 定义“静音”的响度阈值 (值越大, 越不容易被识别为静音)
  split_min_silence_len_ms: 500 # 最小静音时长 (毫秒), 用于过滤字间停顿
  split_offset_from_silence_end_ms: 0 # 在静音区段末尾的偏移量 (毫秒), 负数表示提前

# --- SER (语音情感识别) 配置 ---
ser:
  enable: true # 设置为 true 以启用情感识别
  model_id: "xmj2002/hubert-base-ch-speech-emotion-recognition"
  device: "auto" # "cuda", "cpu", "auto"

# --- ASR (自动语音识别) 相关配置 ---
asr:
  language: "zh" 
  # FunASR 参数
  funasr:
    model: "paraformer-zh"
    use_vad: false 
  whisperx:
    model: "large-v2"
    batch_size: 16

# --- 文本处理配置 ---
text:
  # 繁体转简体
  t2s: true
  # 文本替换规则
  replace_map:
    "|": ""
    "\n": " "
    "\r": ""
    "「": ""
    "」": ""
    " / ": "，"
    "（": ""
    "）": ""
    "(": ""
    ")": ""
    "#": ""
    "{M#他}{F#她}": "他"
    "{M#他们}{F#她们}": "他们"
    "{M他}{F她}": "他"
    "{M他们}{F她们}": "他们"
    "{PLAYERAVATARSEXPRO[INFO_MALE_PRONOUN_HEINFO_FEMALE_PRONOUN_SHE]}": "他"
    
    # --- 特殊规则 ---
    # {ASR}: 将占位符替换为语音识别结果（未完成）
    # 例如，如果 lab 包含 "你好，{PLAYER_NAME}"，并且此规则存在，
    # 程序会识别整个音频，并尝试用识别出的内容替换 {PLAYER_NAME}。
    
    # {SKIP}: 跳过包含此占位符的音频
    # 例如，如果 lab 包含 "BGM-{NICKNAME}"，此音频文件将被完全跳过。
    "{NICKNAME}": "{SKIP}"

# --- 输出配置 ---
output:
  jsonl_output: true # 设置为 true 以便为每个 .list 文件生成一个对应的 .jsonl 格式的标注文件

# --- 音频预处理配置 (新增) ---
audio:
  # 格式归一化
  target_sample_rate: 44100    # 目标采样率 (Hz)
  target_channels: 1           # 目标声道数 (1=单声道, 2=立体声)
  target_bit_depth: 16         # 目标位深 (8, 16, 24, 32)
  input_formats: ["wav", "flac", "mp3", "ogg", "aac", "m4a"]  # 支持的输入格式

  # 首尾静音修剪
  trim_silence:
    enable: true
    top_db: 30                 # 低于此分贝视为"静音"
    frame_length: 2048         # 分析帧长
    hop_length: 512            # 帧移
    min_trim_ms: 100           # 至少切100ms才值得处理
    keep_padding_ms: 50        # 前后各保留缓冲

  # LUFS 响度归一化
  loudness:
    enable: true
    target_lufs: -16           # 目标响度 (LUFS)，TTS建议-16, SVC建议-18
    true_peak: -1.5            # True Peak 限制 (dB)
    lra: 7                     # 响度范围限制 (LU)
    dual_pass: false           # true=更精确的双pass, false=快速单pass

  # DC偏移消除
  dc_offset_removal:
    enable: true               # 顺带在格式归一化中执行
    threshold: 0.001           # DC偏移大于此值才处理

  # 元数据审计
  audit:
    enable: true               # 生成格式审计报告

  # 削波检测
  clipping_detection:
    enable: true
    threshold_ratio: 0.01     # 超过1%样本削波才报警
    clip_threshold: 0.99      # 振幅≥0.99视为削波

  # 静默比例检测
  silence_ratio:
    enable: true
    top_db: 30                # 定义静音的阈值
    warn_threshold: 0.4       # 静默比例>40%警告
    reject_threshold: 0.7     # 静默比例>70%拒绝

  # VAD-SNR 估计
  snr_estimation:
    enable: true
    top_db: 30                # VAD阈值
    warn_db: 20               # SNR < 20dB 警告
    reject_db: 15             # SNR < 15dB 拒绝